[supervisord]
nodaemon=true

[program:streamlit]
command=streamlit run dashboard.py --server.port 10000 --server.address 0.0.0.0
autorestart=true
priority=1

[program:optimizer]
command=python optimizer.py
autorestart=true
priority=2

[program:worker]
command=python worker.py
autorestart=true
priority=3

[program:price_monitor]
command=python price_monitor.py
autorestart=true
priority=4

[program:webhook_engine]
command=python webhook_engine.py
autorestart=true
priority=5

[program:keep_alive]
command=python keep_alive.py
autorestart=true
priority=6